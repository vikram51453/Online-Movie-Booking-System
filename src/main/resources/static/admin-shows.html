<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Shows | CineSphere Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <a href="/admin-dashboard.html" class="text-secondary small">&larr; Back to Dashboard</a>
                <h1 class="h2 text-white mb-0">Showtime Scheduling Management</h1>
            </div>
            <button class="btn btn-cinema btn-cinema-sm" id="btn-add-show">
                <i class="bi bi-calendar-plus me-1"></i> Schedule New Show
            </button>
        </div>

        <div id="shows-loading" class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="text-muted mt-2">Loading scheduled shows...</p>
        </div>

        <div class="cinema-card p-4" id="shows-container" style="display: none;">
            <div class="table-responsive">
                <table class="table table-cinema align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Movie</th>
                            <th>Theatre &amp; Screen</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Base Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="shows-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Show Create/Edit Modal -->
    <div class="modal fade" id="showModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary border-opacity-25">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title" id="show-modal-title">Schedule New Show</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="show-form">
                    <div class="modal-body">
                        <input type="hidden" id="show-id">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="show-movie">Select Movie *</label>
                                <select id="show-movie" class="form-select" required>
                                    <option value="">-- Choose Movie --</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="show-theatre">Select Theatre *</label>
                                <select id="show-theatre" class="form-select" required>
                                    <option value="">-- Choose Theatre --</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="show-screen">Select Screen *</label>
                                <select id="show-screen" class="form-select" required disabled>
                                    <option value="">-- Choose Theatre First --</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="show-base-price">Base Ticket Price (₹) *</label>
                                <input type="number" step="1.00" min="1" id="show-base-price" class="form-control" value="200.00" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="show-date">Show Date *</label>
                                <input type="date" id="show-date" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="show-start-time">Start Time *</label>
                                <input type="time" id="show-start-time" class="form-control" value="18:00" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="show-end-time">End Time (Optional)</label>
                                <input type="time" id="show-end-time" class="form-control">
                            </div>
                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="show-active" checked>
                                    <label class="form-check-label text-secondary" for="show-active">Active for Customer Booking</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary border-opacity-25">
                        <button type="button" class="btn btn-cinema-outline btn-cinema-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-cinema btn-cinema-sm">Save Showtime</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loading = document.getElementById('shows-loading');
            const container = document.getElementById('shows-container');
            const tbody = document.getElementById('shows-tbody');
            const showModal = new bootstrap.Modal(document.getElementById('showModal'));
            const form = document.getElementById('show-form');
            const theatreSelect = document.getElementById('show-theatre');
            const screenSelect = document.getElementById('show-screen');
            const movieSelect = document.getElementById('show-movie');

            let showsCache = [];

            try {
                const user = await API.getCurrentUser();
                if (!user || user.role !== 'ROLE_ADMIN') {
                    window.location.href = '/login.html';
                    return;
                }
                await initDropdownOptions();
                await loadShows();
            } catch (err) {
                showToast('Authorization error: ' + err.message, 'error');
            }

            async function initDropdownOptions() {
                try {
                    const [mRes, tRes] = await Promise.all([
                        API.get('/api/movies'),
                        API.get('/api/theatres')
                    ]);
                    (mRes.data || []).forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.textContent = m.title;
                        movieSelect.appendChild(opt);
                    });
                    (tRes.data || []).forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t.id;
                        opt.textContent = `${t.name} (${t.city})`;
                        theatreSelect.appendChild(opt);
                    });
                } catch (e) {}
            }

            theatreSelect.addEventListener('change', async () => {
                const theatreId = theatreSelect.value;
                screenSelect.innerHTML = '<option value="">-- Choose Screen --</option>';
                if (!theatreId) {
                    screenSelect.disabled = true;
                    return;
                }
                try {
                    const sRes = await API.get(`/api/theatres/${theatreId}/screens`);
                    (sRes.data || []).forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.textContent = `${s.name} (${s.screenType} - ${s.totalSeats} seats)`;
                        screenSelect.appendChild(opt);
                    });
                    screenSelect.disabled = false;
                } catch (e) {
                    showToast('Failed to load screens: ' + e.message, 'error');
                }
            });

            async function loadShows() {
                loading.style.display = 'block';
                container.style.display = 'none';
                try {
                    const res = await API.get('/api/admin/shows');
                    showsCache = res.data || [];
                    renderTable();
                    loading.style.display = 'none';
                    container.style.display = 'block';
                } catch (e) {
                    loading.style.display = 'none';
                    showToast('Failed to load shows: ' + e.message, 'error');
                }
            }

            function renderTable() {
                tbody.innerHTML = '';
                if (showsCache.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-secondary">No shows scheduled yet.</td></tr>`;
                    return;
                }

                showsCache.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div class="text-white fw-bold">${escapeHtml(s.movieTitle)}</div>
                            <div class="text-muted small">Show ID: ${s.id}</div>
                        </td>
                        <td>
                            <div class="text-white">${escapeHtml(s.theatreName)}</div>
                            <span class="badge bg-dark border border-secondary border-opacity-25 text-danger small">${escapeHtml(s.screenName)}</span>
                        </td>
                        <td><span class="text-white">${formatDate(s.showDate)}</span></td>
                        <td><span class="text-warning fw-semibold">${formatTime(s.startTime)}</span></td>
                        <td><strong class="text-white">${formatCurrency(s.basePrice)}</strong></td>
                        <td>
                            <span class="${s.active ? 'badge bg-success bg-opacity-25 text-success' : 'badge bg-danger bg-opacity-25 text-danger'}">
                                ${s.active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">
                                <a href="/seat-selection.html?showId=${s.id}" class="btn btn-cinema-outline btn-cinema-sm" target="_blank" title="View Seating Layout">
                                    <i class="bi bi-grid-3x3"></i>
                                </a>
                                <button class="btn btn-outline-danger btn-cinema-sm" onclick="deleteShow(${s.id})" title="Deactivate Show">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('btn-add-show').addEventListener('click', () => {
                form.reset();
                document.getElementById('show-id').value = '';
                document.getElementById('show-modal-title').textContent = 'Schedule New Show';
                document.getElementById('show-active').checked = true;
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('show-date').value = todayStr;
                document.getElementById('show-date').min = todayStr;
                screenSelect.disabled = true;
                showModal.show();
            });

            window.deleteShow = async function(id) {
                if (!confirm('Deactivate this scheduled show?')) return;
                try {
                    await API.delete('/api/shows/' + id);
                    showToast('Show deactivated successfully', 'success');
                    await loadShows();
                } catch (e) {
                    showToast('Failed to deactivate show: ' + e.message, 'error');
                }
            };

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('show-id').value;
                const payload = {
                    movieId: parseInt(movieSelect.value, 10),
                    screenId: parseInt(screenSelect.value, 10),
                    showDate: document.getElementById('show-date').value,
                    startTime: document.getElementById('show-start-time').value + ':00',
                    endTime: document.getElementById('show-end-time').value ? document.getElementById('show-end-time').value + ':00' : null,
                    basePrice: parseFloat(document.getElementById('show-base-price').value),
                    active: document.getElementById('show-active').checked
                };

                try {
                    if (id) {
                        await API.put('/api/shows/' + id, payload);
                        showToast('Showtime updated successfully', 'success');
                    } else {
                        await API.post('/api/shows', payload);
                        showToast('Show scheduled successfully', 'success');
                    }
                    showModal.hide();
                    await loadShows();
                } catch (err) {
                    showToast('Scheduling error: ' + err.message, 'error');
                }
            });
        });
    </script>
</body>
</html>
