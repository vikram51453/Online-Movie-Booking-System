<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Theatres &amp; Screens | CineSphere Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <a href="/admin-dashboard.html" class="text-secondary small">&larr; Back to Dashboard</a>
                <h1 class="h2 text-white mb-0">Theatre &amp; Screen Management</h1>
            </div>
            <button class="btn btn-cinema btn-cinema-sm" id="btn-add-theatre">
                <i class="bi bi-plus-circle me-1"></i> Add New Theatre
            </button>
        </div>

        <div id="theatres-loading" class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="text-muted mt-2">Loading theatres and screens...</p>
        </div>

        <div class="cinema-card p-4" id="theatres-container" style="display: none;">
            <div class="table-responsive">
                <table class="table table-cinema align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Theatre Name</th>
                            <th>City</th>
                            <th>Address</th>
                            <th>Screens</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="theatres-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Theatre Modal -->
    <div class="modal fade" id="theatreModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary border-opacity-25">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title" id="theatre-modal-title">Add Theatre</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="theatre-form">
                    <div class="modal-body">
                        <input type="hidden" id="theatre-id">
                        <div class="mb-3">
                            <label class="form-label" for="theatre-name">Theatre Name *</label>
                            <input type="text" id="theatre-name" class="form-control" placeholder="Cineplex IMAX Downtown" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="theatre-city">City *</label>
                            <input type="text" id="theatre-city" class="form-control" placeholder="Metropolis" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="theatre-address">Address *</label>
                            <input type="text" id="theatre-address" class="form-control" placeholder="100 Broadway Ave" required>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="theatre-active" checked>
                            <label class="form-check-label text-secondary" for="theatre-active">Active (Visible for shows)</label>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary border-opacity-25">
                        <button type="button" class="btn btn-cinema-outline btn-cinema-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-cinema btn-cinema-sm">Save Theatre</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Screen Modal -->
    <div class="modal fade" id="screenModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary border-opacity-25">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title"><i class="bi bi-display me-2 text-danger"></i>Add Screen to <span id="screen-theatre-name"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="screen-form">
                    <div class="modal-body">
                        <input type="hidden" id="screen-theatre-id">
                        <div class="mb-3">
                            <label class="form-label" for="screen-name">Screen Name *</label>
                            <input type="text" id="screen-name" class="form-control" placeholder="Screen 3 - IMAX Laser" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="screen-type">Screen Experience Type</label>
                            <select id="screen-type" class="form-select">
                                <option value="Standard 2D">Standard 2D</option>
                                <option value="IMAX Laser 3D">IMAX Laser 3D</option>
                                <option value="Dolby Atmos 4K">Dolby Atmos 4K</option>
                                <option value="4DX Motion">4DX Motion</option>
                                <option value="VIP Luxury Recliner">VIP Luxury Recliner</option>
                            </select>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label" for="screen-rows">Row Count (A-H)</label>
                                <input type="number" id="screen-rows" class="form-control" min="4" max="15" value="8" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="screen-cols">Seats Per Row (1-15)</label>
                                <input type="number" id="screen-cols" class="form-control" min="4" max="15" value="10" required>
                            </div>
                        </div>
                        <div class="p-2 bg-dark bg-opacity-75 rounded text-secondary small border border-secondary border-opacity-25">
                            <i class="bi bi-info-circle me-1 text-warning"></i> This will automatically generate Silver, Gold, and Platinum seat tiers with interactive coordinates.
                        </div>
                    </div>
                    <div class="modal-footer border-secondary border-opacity-25">
                        <button type="button" class="btn btn-cinema-outline btn-cinema-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-cinema btn-cinema-sm">Generate Screen &amp; Seats</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- View Screens Modal -->
    <div class="modal fade" id="viewScreensModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary border-opacity-25">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title">Screens in <span id="view-screens-theatre-title" class="text-warning"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="screens-modal-loading" class="text-center py-4">
                        <div class="spinner-border spinner-border-sm text-danger" role="status"></div>
                    </div>
                    <div id="screens-modal-list" class="row g-3" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loading = document.getElementById('theatres-loading');
            const container = document.getElementById('theatres-container');
            const tbody = document.getElementById('theatres-tbody');
            const theatreModal = new bootstrap.Modal(document.getElementById('theatreModal'));
            const screenModal = new bootstrap.Modal(document.getElementById('screenModal'));
            const viewScreensModal = new bootstrap.Modal(document.getElementById('viewScreensModal'));

            let theatresCache = [];

            try {
                const user = await API.getCurrentUser();
                if (!user || user.role !== 'ROLE_ADMIN') {
                    window.location.href = '/login.html';
                    return;
                }
                await loadTheatres();
            } catch (err) {
                showToast('Authorization error: ' + err.message, 'error');
            }

            async function loadTheatres() {
                loading.style.display = 'block';
                container.style.display = 'none';
                try {
                    const res = await API.get('/api/admin/theatres');
                    theatresCache = res.data || [];
                    renderTable();
                    loading.style.display = 'none';
                    container.style.display = 'block';
                } catch (e) {
                    loading.style.display = 'none';
                    showToast('Failed to load theatres: ' + e.message, 'error');
                }
            }

            function renderTable() {
                tbody.innerHTML = '';
                if (theatresCache.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-secondary">No theatres found.</td></tr>`;
                    return;
                }

                theatresCache.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div class="text-white fw-bold">${escapeHtml(t.name)}</div>
                            <div class="text-muted small">ID: ${t.id}</div>
                        </td>
                        <td><span class="badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50">${escapeHtml(t.city)}</span></td>
                        <td><span class="text-secondary small">${escapeHtml(t.address)}</span></td>
                        <td>
                            <button class="btn btn-cinema-outline btn-cinema-sm" onclick="viewScreens(${t.id}, '${escapeHtml(t.name)}')">
                                <i class="bi bi-display me-1"></i> ${t.totalScreens} Screens
                            </button>
                        </td>
                        <td>
                            <span class="${t.active ? 'badge bg-success bg-opacity-25 text-success' : 'badge bg-danger bg-opacity-25 text-danger'}">
                                ${t.active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">
                                <button class="btn btn-cinema btn-cinema-sm" onclick="openAddScreen(${t.id}, '${escapeHtml(t.name)}')">
                                    <i class="bi bi-plus-circle me-1"></i> Add Screen
                                </button>
                                <button class="btn btn-cinema-outline btn-cinema-sm" onclick="editTheatre(${t.id})">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-outline-danger btn-cinema-sm" onclick="deleteTheatre(${t.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('btn-add-theatre').addEventListener('click', () => {
                document.getElementById('theatre-form').reset();
                document.getElementById('theatre-id').value = '';
                document.getElementById('theatre-modal-title').textContent = 'Add New Theatre';
                document.getElementById('theatre-active').checked = true;
                theatreModal.show();
            });

            window.editTheatre = function(id) {
                const t = theatresCache.find(x => x.id === id);
                if (!t) return;
                document.getElementById('theatre-id').value = t.id;
                document.getElementById('theatre-modal-title').textContent = 'Edit Theatre: ' + t.name;
                document.getElementById('theatre-name').value = t.name;
                document.getElementById('theatre-city').value = t.city;
                document.getElementById('theatre-address').value = t.address;
                document.getElementById('theatre-active').checked = t.active;
                theatreModal.show();
            };

            window.deleteTheatre = async function(id) {
                if (!confirm('Deactivate this cinema theatre?')) return;
                try {
                    await API.delete('/api/theatres/' + id);
                    showToast('Theatre deactivated successfully', 'success');
                    await loadTheatres();
                } catch (e) {
                    showToast('Failed to deactivate: ' + e.message, 'error');
                }
            };

            document.getElementById('theatre-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('theatre-id').value;
                const payload = {
                    name: document.getElementById('theatre-name').value.trim(),
                    city: document.getElementById('theatre-city').value.trim(),
                    address: document.getElementById('theatre-address').value.trim(),
                    active: document.getElementById('theatre-active').checked
                };

                try {
                    if (id) {
                        await API.put('/api/theatres/' + id, payload);
                        showToast('Theatre updated successfully', 'success');
                    } else {
                        await API.post('/api/theatres', payload);
                        showToast('Theatre added successfully', 'success');
                    }
                    theatreModal.hide();
                    await loadTheatres();
                } catch (err) {
                    showToast('Save failed: ' + err.message, 'error');
                }
            });

            window.openAddScreen = function(theatreId, theatreName) {
                document.getElementById('screen-form').reset();
                document.getElementById('screen-theatre-id').value = theatreId;
                document.getElementById('screen-theatre-name').textContent = theatreName;
                screenModal.show();
            };

            document.getElementById('screen-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const payload = {
                    theatreId: parseInt(document.getElementById('screen-theatre-id').value, 10),
                    name: document.getElementById('screen-name').value.trim(),
                    screenType: document.getElementById('screen-type').value,
                    rowsCount: parseInt(document.getElementById('screen-rows').value, 10),
                    colsCount: parseInt(document.getElementById('screen-cols').value, 10)
                };

                try {
                    await API.post('/api/theatres/screens', payload);
                    screenModal.hide();
                    showToast('Screen and seat grid generated successfully', 'success');
                    await loadTheatres();
                } catch (err) {
                    showToast('Failed to create screen: ' + err.message, 'error');
                }
            });

            window.viewScreens = async function(theatreId, theatreName) {
                document.getElementById('view-screens-theatre-title').textContent = theatreName;
                const mLoading = document.getElementById('screens-modal-loading');
                const mList = document.getElementById('screens-modal-list');
                mLoading.style.display = 'block';
                mList.style.display = 'none';
                viewScreensModal.show();

                try {
                    const res = await API.get(`/api/theatres/${theatreId}/screens`);
                    mLoading.style.display = 'none';
                    mList.innerHTML = '';
                    const screens = res.data || [];

                    if (screens.length === 0) {
                        mList.innerHTML = `<div class="col-12 text-center text-secondary py-3">No screens configured yet.</div>`;
                    } else {
                        screens.forEach(s => {
                            const col = document.createElement('div');
                            col.className = 'col-md-6';
                            col.innerHTML = `
                                <div class="p-3 bg-dark bg-opacity-75 rounded border border-secondary border-opacity-25">
                                    <div class="fw-bold text-white mb-1">${escapeHtml(s.name)}</div>
                                    <div class="badge bg-secondary mb-2">${escapeHtml(s.screenType)}</div>
                                    <div class="text-secondary small">
                                        Capacity: <strong class="text-white">${s.totalSeats} seats</strong> (${s.rowsCount} rows × ${s.colsCount} cols)
                                    </div>
                                </div>
                            `;
                            mList.appendChild(col);
                        });
                    }
                    mList.style.display = 'flex';
                } catch (e) {
                    mLoading.innerHTML = `<div class="text-danger small">Error loading screens: ${e.message}</div>`;
                }
            };
        });
    </script>
</body>
</html>
