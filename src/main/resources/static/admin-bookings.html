<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings | CineSphere Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <a href="/admin-dashboard.html" class="text-secondary small">&larr; Back to Dashboard</a>
                <h1 class="h2 text-white mb-0">Customer Reservation Auditing</h1>
            </div>
            <div class="d-flex gap-2 mt-3 mt-md-0">
                <select id="filter-status" class="form-select form-select-sm" style="width: 170px;">
                    <option value="">All Statuses</option>
                    <option value="CONFIRMED">CONFIRMED</option>
                    <option value="CANCELLED">CANCELLED</option>
                </select>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" id="booking-search" class="form-control" placeholder="Search by booking reference, customer name, or movie...">
            </div>
        </div>

        <div id="admin-bookings-loading" class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="text-muted mt-2">Loading customer bookings...</p>
        </div>

        <div class="cinema-card p-4" id="admin-bookings-container" style="display: none;">
            <div class="table-responsive">
                <table class="table table-cinema align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Reference</th>
                            <th>Customer</th>
                            <th>Movie &amp; Venue</th>
                            <th>Showtime</th>
                            <th>Seats</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-bookings-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loading = document.getElementById('admin-bookings-loading');
            const container = document.getElementById('admin-bookings-container');
            const tbody = document.getElementById('admin-bookings-tbody');
            const searchInput = document.getElementById('booking-search');
            const statusSelect = document.getElementById('filter-status');

            let bookingsCache = [];

            try {
                const user = await API.getCurrentUser();
                if (!user || user.role !== 'ROLE_ADMIN') {
                    window.location.href = '/login.html';
                    return;
                }
                await loadAllBookings();
            } catch (err) {
                showToast('Authorization error: ' + err.message, 'error');
            }

            async function loadAllBookings() {
                loading.style.display = 'block';
                container.style.display = 'none';

                try {
                    const status = statusSelect.value;
                    const url = '/api/admin/bookings' + (status ? `?status=${status}` : '');
                    const res = await API.get(url);
                    bookingsCache = res.data || [];
                    renderTable();
                    loading.style.display = 'none';
                    container.style.display = 'block';
                } catch (e) {
                    loading.style.display = 'none';
                    showToast('Failed to load bookings: ' + e.message, 'error');
                }
            }

            function renderTable() {
                tbody.innerHTML = '';
                const query = searchInput.value.toLowerCase().trim();

                const filtered = bookingsCache.filter(b => 
                    b.bookingReference.toLowerCase().includes(query) ||
                    (b.userName && b.userName.toLowerCase().includes(query)) ||
                    (b.userEmail && b.userEmail.toLowerCase().includes(query)) ||
                    (b.movieTitle && b.movieTitle.toLowerCase().includes(query))
                );

                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-secondary">No customer bookings found.</td></tr>`;
                    return;
                }

                filtered.forEach(b => {
                    const tr = document.createElement('tr');
                    const isConfirmed = b.status === 'CONFIRMED';
                    tr.innerHTML = `
                        <td>
                            <strong class="text-warning font-monospace">${b.bookingReference}</strong>
                            <div class="text-muted" style="font-size: 0.75rem;">${formatDate(b.bookingTime)}</div>
                        </td>
                        <td>
                            <div class="text-white">${escapeHtml(b.userName)}</div>
                            <div class="text-secondary small">${escapeHtml(b.userEmail)}</div>
                        </td>
                        <td>
                            <div class="text-white fw-bold">${escapeHtml(b.movieTitle)}</div>
                            <div class="text-secondary small">${escapeHtml(b.theatreName)} (${escapeHtml(b.screenName)})</div>
                        </td>
                        <td>
                            <div class="text-white small">${formatDate(b.showDate)}</div>
                            <div class="text-warning small">${formatTime(b.startTime)}</div>
                        </td>
                        <td><span class="badge bg-dark border border-secondary border-opacity-25">${b.seatNumbers.join(', ')}</span></td>
                        <td><strong class="text-white">${formatCurrency(b.totalAmount)}</strong></td>
                        <td>
                            <span class="${isConfirmed ? 'badge-status-confirmed' : 'badge-status-cancelled'}">
                                ${b.status}
                            </span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">
                                <a href="/booking-confirmation.html?ref=${b.bookingReference}" class="btn btn-cinema-outline btn-cinema-sm" target="_blank" title="View Ticket">
                                    <i class="bi bi-eye"></i>
                                </a>
                                ${isConfirmed ? `
                                <button class="btn btn-outline-danger btn-cinema-sm" onclick="cancelAdminBooking(${b.id})" title="Cancel & Refund">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                                ` : ''}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            window.cancelAdminBooking = async function(id) {
                if (!confirm('Cancel this customer booking and release seats back to inventory?')) return;
                try {
                    await API.post(`/api/bookings/${id}/cancel`, {});
                    showToast('Booking cancelled and seats released', 'success');
                    await loadAllBookings();
                } catch (e) {
                    showToast('Cancellation error: ' + e.message, 'error');
                }
            };

            searchInput.addEventListener('input', renderTable);
            statusSelect.addEventListener('change', loadAllBookings);
        });
    </script>
</body>
</html>
