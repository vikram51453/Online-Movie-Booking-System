<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile | CineSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="cinema-card-glass p-4 mb-4">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 pb-4 mb-4 border-bottom border-secondary border-opacity-25">
                        <div class="d-flex align-items-center gap-3">
                            <div class="p-3 bg-danger bg-opacity-25 rounded-circle text-danger border border-danger border-opacity-50">
                                <i class="bi bi-person-fill fs-2"></i>
                            </div>
                            <div>
                                <h1 class="h3 text-white mb-0" id="profile-name">User Profile</h1>
                                <span class="badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50 mt-1" id="profile-role">ROLE_CUSTOMER</span>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="/my-bookings.html" class="btn btn-cinema btn-cinema-sm">
                                <i class="bi bi-ticket-perforated me-1"></i> My Bookings
                            </a>
                            <button class="btn btn-cinema-outline btn-cinema-sm" onclick="API.logout()">
                                <i class="bi bi-box-arrow-right me-1"></i> Logout
                            </button>
                        </div>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Full Name</label>
                            <div class="text-white fw-semibold fs-5" id="profile-fullname">-</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Email Address</label>
                            <div class="text-white fw-semibold fs-5" id="profile-email">-</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Contact Number</label>
                            <div class="text-white fw-semibold fs-5" id="profile-phone">-</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Account Type</label>
                            <div class="text-white fw-semibold fs-5" id="profile-tier">Cinema Loyalty Member</div>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon red"><i class="bi bi-ticket"></i></div>
                            <div>
                                <div class="fs-4 fw-bold text-white" id="stat-total-bookings">0</div>
                                <div class="text-secondary small">Total Reservations</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon green"><i class="bi bi-check2-circle"></i></div>
                            <div>
                                <div class="fs-4 fw-bold text-white" id="stat-active-tickets">0</div>
                                <div class="text-secondary small">Confirmed Tickets</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon gold"><i class="bi bi-cash-stack"></i></div>
                            <div>
                                <div class="fs-4 fw-bold text-white" id="stat-total-spent">₹0.00</div>
                                <div class="text-secondary small">Total Spent</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const user = await API.getCurrentUser();
                if (!user) {
                    window.location.href = '/login.html?redirect=/profile.html';
                    return;
                }

                document.getElementById('profile-name').textContent = user.fullName;
                document.getElementById('profile-fullname').textContent = user.fullName;
                document.getElementById('profile-email').textContent = user.email;
                document.getElementById('profile-phone').textContent = user.phone || 'Not provided';
                document.getElementById('profile-role').textContent = user.role;

                // Load booking statistics
                const bookingsRes = await API.get('/api/bookings/my');
                const bookings = bookingsRes.data || [];
                document.getElementById('stat-total-bookings').textContent = bookings.length;

                const confirmed = bookings.filter(b => b.status === 'CONFIRMED');
                document.getElementById('stat-active-tickets').textContent = confirmed.length;

                const totalSpent = confirmed.reduce((acc, b) => acc + Number(b.totalAmount), 0);
                document.getElementById('stat-total-spent').textContent = formatCurrency(totalSpent);

            } catch (err) {
                showToast('Failed to load profile: ' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
