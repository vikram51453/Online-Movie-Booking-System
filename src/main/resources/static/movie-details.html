<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details | CineSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container my-5">
        <div id="movie-details-loading" class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="text-muted mt-2">Loading movie details...</p>
        </div>

        <div id="movie-details-content" style="display: none;">
            <!-- Hero Details Section -->
            <div class="cinema-card-glass mb-5">
                <div class="row g-4 align-items-center">
                    <div class="col-md-4 col-lg-3 text-center">
                        <img id="detail-poster" src="" alt="Movie Poster" class="img-fluid rounded shadow-lg" style="max-height: 420px; object-fit: cover;">
                    </div>
                    <div class="col-md-8 col-lg-9">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                            <span id="detail-genre" class="badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50"></span>
                            <span id="detail-lang" class="badge bg-secondary"></span>
                            <span id="detail-duration" class="badge bg-secondary"></span>
                        </div>
                        <h1 id="detail-title" class="display-6 fw-bold text-white mb-2"></h1>

                        <div class="d-flex align-items-center gap-3 my-3">
                            <div class="d-flex align-items-center text-warning fs-5">
                                <i class="bi bi-star-fill me-2"></i>
                                <span id="detail-rating" class="fw-bold"></span>
                                <span class="text-muted fs-6 ms-1">/10</span>
                            </div>
                            <span class="text-muted">|</span>
                            <div class="text-secondary small">
                                <i class="bi bi-calendar me-1"></i> Release: <span id="detail-release"></span>
                            </div>
                        </div>

                        <p id="detail-desc" class="text-secondary lead fs-6 mb-4"></p>

                        <div class="d-flex flex-wrap gap-3">
                            <a id="btn-book-movie" href="#" class="btn btn-cinema px-4 py-2">
                                <i class="bi bi-ticket-perforated me-1"></i> Book Tickets Now
                            </a>
                            <a id="btn-theatres-movie" href="#" class="btn btn-cinema-outline px-4 py-2">
                                <i class="bi bi-geo-alt me-1"></i> Select Theatre
                            </a>
                            <a id="btn-trailer" href="#" target="_blank" class="btn btn-cinema-outline px-3 py-2 text-danger">
                                <i class="bi bi-play-circle me-1"></i> Watch Trailer
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Available Shows for This Movie Section -->
            <div class="cinema-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="h4 mb-1">Available Showtimes</h3>
                        <p class="text-secondary small mb-0">Select a date and screen to reserve your seats</p>
                    </div>
                </div>

                <div id="movie-shows-loading" class="text-center py-4">
                    <div class="spinner-border spinner-border-sm text-danger" role="status"></div>
                </div>

                <div id="movie-shows-container" class="row g-3" style="display: none;"></div>

                <div id="movie-shows-empty" class="text-center py-4" style="display: none;">
                    <i class="bi bi-clock-history fs-2 text-muted mb-2 d-block"></i>
                    <p class="text-secondary mb-0">No active showtimes currently scheduled for this movie.</p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const movieId = getQueryParam('id');
            if (!movieId) {
                window.location.href = '/movies.html';
                return;
            }

            const loading = document.getElementById('movie-details-loading');
            const content = document.getElementById('movie-details-content');

            try {
                const res = await API.get('/api/movies/' + movieId);
                const movie = res.data;

                document.title = `${movie.title} | CineSphere`;
                document.getElementById('detail-poster').src = movie.posterUrl || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80';
                document.getElementById('detail-title').textContent = movie.title;
                document.getElementById('detail-genre').textContent = movie.genre;
                document.getElementById('detail-lang').textContent = movie.language;
                document.getElementById('detail-duration').textContent = `${movie.durationMinutes} Minutes`;
                document.getElementById('detail-rating').textContent = movie.rating ? movie.rating.toFixed(1) : '8.5';
                document.getElementById('detail-release').textContent = formatDate(movie.releaseDate);
                document.getElementById('detail-desc').textContent = movie.description || 'Experience this unforgettable cinema masterpiece on the big screen with surround sound.';

                document.getElementById('btn-book-movie').href = `/shows.html?movieId=${movie.id}`;
                document.getElementById('btn-theatres-movie').href = `/theatres.html?movieId=${movie.id}`;

                const trailerBtn = document.getElementById('btn-trailer');
                if (movie.trailerUrl) {
                    trailerBtn.href = movie.trailerUrl;
                } else {
                    trailerBtn.style.display = 'none';
                }

                loading.style.display = 'none';
                content.style.display = 'block';

                loadShowsForMovie(movieId);
            } catch (err) {
                loading.innerHTML = `
                    <div class="text-danger py-5">
                        <i class="bi bi-exclamation-triangle fs-1 d-block mb-2"></i>
                        <h5>Movie Not Found</h5>
                        <p class="text-secondary">${escapeHtml(err.message)}</p>
                        <a href="/movies.html" class="btn btn-cinema btn-cinema-sm mt-2">Back to Movies</a>
                    </div>
                `;
            }
        });

        async function loadShowsForMovie(movieId) {
            const showsLoading = document.getElementById('movie-shows-loading');
            const showsContainer = document.getElementById('movie-shows-container');
            const showsEmpty = document.getElementById('movie-shows-empty');

            try {
                const res = await API.get(`/api/shows?movieId=${movieId}`);
                showsLoading.style.display = 'none';

                if (!res.data || res.data.length === 0) {
                    showsEmpty.style.display = 'block';
                    return;
                }

                showsContainer.innerHTML = '';
                res.data.forEach(show => {
                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-4';
                    col.innerHTML = `
                        <div class="cinema-card p-3 h-100 d-flex flex-column justify-content-between border-secondary border-opacity-25">
                            <div>
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="h6 text-white mb-0">${escapeHtml(show.theatreName)}</h5>
                                    <span class="badge bg-secondary small">${escapeHtml(show.theatreCity)}</span>
                                </div>
                                <div class="text-secondary small mb-2">
                                    <i class="bi bi-display me-1 text-danger"></i> ${escapeHtml(show.screenName)} (${escapeHtml(show.screenType)})
                                </div>
                                <div class="d-flex align-items-center gap-3 my-2 small">
                                    <span class="text-white"><i class="bi bi-calendar me-1"></i> ${formatDate(show.showDate)}</span>
                                    <span class="text-warning fw-semibold"><i class="bi bi-clock me-1"></i> ${formatTime(show.startTime)}</span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary border-opacity-25">
                                <div class="text-white fw-bold">From ${formatCurrency(show.basePrice)}</div>
                                <a href="/seat-selection.html?showId=${show.id}" class="btn btn-cinema btn-cinema-sm">
                                    Select Seats <i class="bi bi-chevron-right ms-1"></i>
                                </a>
                            </div>
                        </div>
                    `;
                    showsContainer.appendChild(col);
                });
                showsContainer.style.display = 'flex';
            } catch (e) {
                showsLoading.style.display = 'none';
                showsEmpty.style.display = 'block';
            }
        }
    </script>
</body>
</html>
