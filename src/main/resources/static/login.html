<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | CineSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container my-5 py-3">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="cinema-card-glass shadow-lg">
                    <div class="text-center mb-4">
                        <i class="bi bi-film fs-1 text-danger"></i>
                        <h2 class="mt-2 mb-1">Welcome Back</h2>
                        <p class="text-secondary small">Sign in to access your bookings and reserve tickets</p>
                    </div>

                    <div id="login-error" class="alert alert-danger py-2 small" style="display: none;"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label" for="login-email"><i class="bi bi-envelope me-1"></i> Email Address</label>
                            <input type="email" id="login-email" class="form-control" placeholder="user@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="login-password"><i class="bi bi-lock me-1"></i> Password</label>
                            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
                        </div>

                        <button type="submit" id="login-submit-btn" class="btn btn-cinema w-100 py-2">
                            <span id="login-btn-text"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
                            <span id="login-btn-spinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                        </button>
                    </form>

                    <!-- Quick Test Logins -->
                    <div class="mt-4 p-3 bg-light rounded border border-subtle small">
                        <div class="fw-semibold mb-2" style="color: var(--text-pure);"><i class="bi bi-key me-1 text-warning"></i> Quick Logins:</div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-cinema-outline flex-grow-1" onclick="fillCredentials('customer@cinemabooking.com', 'Customer@123')">
                                <i class="bi bi-person me-1"></i> Customer
                            </button>
                            <button type="button" class="btn btn-sm btn-cinema-outline flex-grow-1" onclick="fillCredentials('admin@cinemabooking.com', 'Admin@123456')">
                                <i class="bi bi-shield-lock me-1 text-danger"></i> Admin
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25 text-secondary small">
                        Don't have an account yet? <a href="/register.html" class="text-danger fw-semibold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        function fillCredentials(email, pass) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = pass;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('login-error');
            const submitBtn = document.getElementById('login-submit-btn');
            const btnText = document.getElementById('login-btn-text');
            const btnSpinner = document.getElementById('login-btn-spinner');

            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            btnSpinner.style.display = 'inline-block';

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const user = await API.login(email, password);
                showToast(`Welcome back, ${user.fullName}!`, 'success');
                setTimeout(() => {
                    const redirect = getQueryParam('redirect');
                    if (redirect) {
                        window.location.href = redirect;
                    } else if (user.role === 'ROLE_ADMIN') {
                        window.location.href = '/admin-dashboard.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                }, 700);
            } catch (err) {
                errorBox.textContent = err.message || 'Invalid email or password.';
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
