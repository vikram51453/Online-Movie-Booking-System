<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Showtimes | CineSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container my-5">
        <div class="row align-items-center mb-4">
            <div class="col-md-7">
                <h1 class="h2 mb-1">Select Showtime</h1>
                <p class="text-secondary mb-0">Choose date, cinema screen, and show timing to reserve your seats</p>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="cinema-card p-3 mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <label class="form-label small mb-1" for="filter-movie">Select Movie</label>
                    <select id="filter-movie" class="form-select">
                        <option value="">All Movies</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small mb-1" for="filter-theatre">Select Theatre</label>
                    <select id="filter-theatre" class="form-select">
                        <option value="">All Theatres</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small mb-1" for="filter-date">Date</label>
                    <input type="date" id="filter-date" class="form-control">
                </div>
            </div>
        </div>

        <div id="shows-loading" class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="text-muted mt-2">Loading available shows...</p>
        </div>

        <div class="row g-4" id="shows-list" style="display: none;"></div>

        <div id="shows-empty" class="text-center py-5 cinema-card" style="display: none;">
            <i class="bi bi-calendar-x fs-1 text-muted mb-3 d-block"></i>
            <h5>No Shows Found</h5>
            <p class="text-secondary">No shows currently match the selected movie, theatre, or date filter.</p>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const movieSelect = document.getElementById('filter-movie');
            const theatreSelect = document.getElementById('filter-theatre');
            const dateInput = document.getElementById('filter-date');
            const list = document.getElementById('shows-list');
            const loading = document.getElementById('shows-loading');
            const empty = document.getElementById('shows-empty');

            const initialMovieId = getQueryParam('movieId');
            const initialTheatreId = getQueryParam('theatreId');

            // Default date
            const todayStr = new Date().toISOString().split('T')[0];
            dateInput.min = todayStr;
            dateInput.value = '2026-10-21';

            async function initDropdowns() {
                try {
                    const [moviesRes, theatresRes] = await Promise.all([
                        API.get('/api/movies'),
                        API.get('/api/theatres')
                    ]);

                    if (moviesRes.data) {
                        moviesRes.data.forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m.id;
                            opt.textContent = m.title;
                            if (initialMovieId && m.id == initialMovieId) opt.selected = true;
                            movieSelect.appendChild(opt);
                        });
                    }

                    if (theatresRes.data) {
                        theatresRes.data.forEach(t => {
                            const opt = document.createElement('option');
                            opt.value = t.id;
                            opt.textContent = `${t.name} (${t.city})`;
                            if (initialTheatreId && t.id == initialTheatreId) opt.selected = true;
                            theatreSelect.appendChild(opt);
                        });
                    }
                } catch (e) {
                    console.debug(e);
                }
            }

            async function loadShows() {
                loading.style.display = 'block';
                list.style.display = 'none';
                empty.style.display = 'none';

                try {
                    const params = new URLSearchParams();
                    if (movieSelect.value) params.append('movieId', movieSelect.value);
                    if (theatreSelect.value) params.append('theatreId', theatreSelect.value);
                    if (dateInput.value) params.append('showDate', dateInput.value);

                    const res = await API.get('/api/shows' + (params.toString() ? '?' + params.toString() : ''));
                    loading.style.display = 'none';

                    if (!res.data || res.data.length === 0) {
                        empty.style.display = 'block';
                        return;
                    }

                    list.innerHTML = '';
                    res.data.forEach(show => {
                        const col = document.createElement('div');
                        col.className = 'col-md-6 col-lg-4';
                        col.innerHTML = `
                            <div class="cinema-card p-4 h-100 d-flex flex-column justify-content-between">
                                <div>
                                    <div class="d-flex gap-3 align-items-center mb-3">
                                        <img src="${show.moviePosterUrl || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=200&q=80'}" alt="" style="width: 55px; height: 80px; object-fit: cover; border-radius: 6px;">
                                        <div>
                                            <h4 class="h6 text-white mb-1">${escapeHtml(show.movieTitle)}</h4>
                                            <div class="text-secondary small">${show.movieDuration || 120} min</div>
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <div class="fw-semibold text-white small">${escapeHtml(show.theatreName)}</div>
                                        <div class="text-secondary small"><i class="bi bi-geo-alt me-1"></i>${escapeHtml(show.theatreCity)}</div>
                                    </div>
                                    <div class="badge bg-dark border border-secondary border-opacity-25 text-danger mb-3">
                                        <i class="bi bi-display me-1"></i> ${escapeHtml(show.screenName)} (${escapeHtml(show.screenType)})
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center bg-dark bg-opacity-50 p-2 rounded small mb-3">
                                        <span class="text-secondary"><i class="bi bi-calendar me-1"></i> ${formatDate(show.showDate)}</span>
                                        <span class="text-warning fw-bold fs-6"><i class="bi bi-clock me-1"></i> ${formatTime(show.startTime)}</span>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-25">
                                    <div class="text-white">
                                        <span class="text-secondary small d-block">Starting from</span>
                                        <strong class="fs-5 text-white">${formatCurrency(show.basePrice)}</strong>
                                    </div>
                                    <a href="/seat-selection.html?showId=${show.id}" class="btn btn-cinema">
                                        Select Seats <i class="bi bi-arrow-right ms-1"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                        list.appendChild(col);
                    });
                    list.style.display = 'flex';
                } catch (err) {
                    loading.style.display = 'none';
                    showToast('Failed to load shows: ' + err.message, 'error');
                }
            }

            movieSelect.addEventListener('change', loadShows);
            theatreSelect.addEventListener('change', loadShows);
            dateInput.addEventListener('change', loadShows);

            await initDropdowns();
            await loadShows();
        });
    </script>
</body>
</html>
