<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CineSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container my-5 py-3">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="cinema-card-glass shadow-lg">
                    <div class="text-center mb-4">
                        <i class="bi bi-film fs-1 text-danger"></i>
                        <h2 class="mt-2 mb-1">Create Account</h2>
                        <p class="text-secondary small">Join CineSphere for instant ticket booking and exclusive perks</p>
                    </div>

                    <div id="register-error" class="alert alert-danger py-2 small" style="display: none;"></div>

                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label" for="reg-name"><i class="bi bi-person me-1"></i> Full Name</label>
                            <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required minlength="2">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="reg-email"><i class="bi bi-envelope me-1"></i> Email Address</label>
                            <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="reg-phone"><i class="bi bi-telephone me-1"></i> Phone Number</label>
                            <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="reg-password"><i class="bi bi-lock me-1"></i> Password</label>
                            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="reg-confirm-password"><i class="bi bi-shield-check me-1"></i> Confirm Password</label>
                            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6">
                        </div>

                        <button type="submit" id="reg-submit-btn" class="btn btn-cinema w-100 py-2">
                            <span id="reg-btn-text"><i class="bi bi-person-check me-1"></i> Register &amp; Continue</span>
                            <span id="reg-btn-spinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25 text-secondary small">
                        Already have an account? <a href="/login.html" class="text-danger fw-semibold">Sign in here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('register-error');
            const submitBtn = document.getElementById('reg-submit-btn');
            const btnText = document.getElementById('reg-btn-text');
            const btnSpinner = document.getElementById('reg-btn-spinner');

            errorBox.style.display = 'none';

            const fullName = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) {
                errorBox.textContent = 'Passwords do not match.';
                errorBox.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            btnSpinner.style.display = 'inline-block';

            try {
                const user = await API.register({ fullName, email, phone, password });
                showToast('Registration successful! Welcome to CineSphere.', 'success');
                setTimeout(() => {
                    const redirect = getQueryParam('redirect') || '/index.html';
                    window.location.href = redirect;
                }, 800);
            } catch (err) {
                errorBox.textContent = err.message || 'Registration failed. Please check inputs.';
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
