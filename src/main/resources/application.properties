# Spring Boot Application Configuration
spring.application.name=movie-booking

# Server Configuration (8081 default as 8080 is reserved by system services)
server.port=${SERVER_PORT:8081}
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Database Configuration (MySQL 8)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movie_booking}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Application Seeding & Admin Configuration
app.seed.enabled=${SEED_DATA_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@cinemabooking.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123456}
app.admin.name=System Administrator
app.admin.phone=9876543210
