# Test Application Configuration using H2 in MySQL mode
spring.application.name=movie-booking-test

server.port=0
server.servlet.session.timeout=60m

# In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test configuration
app.seed.enabled=false
app.admin.email=testadmin@cinemabooking.com
app.admin.password=AdminTest@123
app.admin.name=Test Admin
app.admin.phone=9999999999
